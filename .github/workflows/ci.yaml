name: Devtools CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - "*"

jobs:
  ci:
    name: CI Node.js
    runs-on: ubuntu-latest
    steps:
      # 1️⃣ Checkout do repositório
      - uses: actions/checkout@v3

      # 2️⃣ Setup Node.js
      - uses: actions/setup-node@v3
        with:
          node-version: 16
          cache: "npm"

      # 3️⃣ Instala dependências usando npm
      - name: Install dependencies
        run: npm ci

      # 4️⃣ Configura commit SHA (opcional para CI)
      - name: Set COMMIT_SHA
        shell: bash
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
            echo "COMMIT_SHA=${{ github.event.pull_request.head.sha }}" >> ${GITHUB_ENV}
          else
            echo "COMMIT_SHA=${GITHUB_SHA}" >> ${GITHUB_ENV}

      # 5️⃣ Executa Husky + Commitlint se necessário (opcional)
      - name: Validate commits (Commitlint)
        run: npx commitlint --from=HEAD~1 --to=HEAD
        # isso verifica a mensagem do último commit

      # 6️⃣ Roda os testes
      - name: Run tests
        run: |
          npm test
          npm run test:e2e
